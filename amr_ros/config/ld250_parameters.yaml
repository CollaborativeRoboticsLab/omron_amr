amr_core:
  ros__parameters:
    robot:
      ip: "192.168.1.1"
      port: 7272
      user: "admin"
      password: "admin"
      protocol: "6MTX"

    status:
      publish: true
      topic: "amr/status"
      battery_topic: "amr/battery_state"
      publish_period_ms: 200

    laser:
      main_laser:
        enabled: true
        topic: "scan"
        frame_id: "laser_frame"
        request: "Laser_1Current"
        request_period_ms: 200
        angle_min: -2.09439510239
        angle_max: 2.09439510239
        angle_increment: 0.00872664626
        range_min: 0.02
        range_max: 40.0
      low_laser:
        enabled: true
        topic: "scan_low"
        frame_id: "laser_frame_low"
        request: "Laser_2Current"
        request_period_ms: 200
        angle_min: -1.09955742876
        angle_max: 1.09955742876
        angle_increment: 0.00872664626
        range_min: 0.02
        range_max: 4.0

    fault:
      auto_acknowledge_fault_list: ["IrregularShutdown"]
      ros_service:
        enabled: false
        name: "acknowledge_fault"
      monitor:
        enabled: true
        auto_acknowledge_enabled: false

    driver:
      odom:
        topic: "odom"
        frame_id: "odom"
        publish: true
      cmd_vel:
        topic: "cmd_vel"
        min_linear: -200.0
        max_linear: 1000.0
        min_angular: -60.0
        max_angular: 60.0
        timeout_sec: 0.2
      stop:
        topic: "stop"
      tf:
        enabled: true
        base_frame: "base_link"
      network:
        tcp_queue_max_packets: 32
        tcp_queue_max_bytes: 65536
        tcp_queue_max_age_sec: 0.1
      drive:
        send_frequency: 20.0
        throttle_pct: 100.0
        ratio_mapping: "legacy"
        unsafe_drive: true
        mode_check_period_sec: 0.5
        mode_confirmation_timeout_sec: 2.0
      calibration:
        confirmed: false
        source: ""
        full_throttle_forward_mm_s: 0.0
        full_throttle_reverse_mm_s: 0.0
        rotation_stopped_deg_s: 0.0
        rotation_full_forward_deg_s: 0.0
        rotation_full_reverse_deg_s: 0.0
        translation_dead_zone_pct: -1.0
        rotation_dead_zone_pct: -1.0
        feedback_timeout_sec: 0.2
      docking:
        start_from_dock: true